{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ClassNote AI, a local-first classroom lecture companion.">
  <title>{% block title %}ClassNote AI{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body class="bg-light">
  <a class="visually-hidden-focusable" href="#main">Skip to content</a>
  <header class="bg-white border-bottom">
    <nav class="container py-3" aria-label="Main navigation">
      <a class="navbar-brand fw-bold" href="{% url 'home' %}">ClassNote <span class="text-primary">AI</span></a>
    </nav>
  </header>
  <main id="main" class="container py-5">{% block content %}{% endblock %}</main>
  <footer class="container pb-4 text-secondary small">Built for learning. Designed for local processing.</footer>
</body>
</html>
